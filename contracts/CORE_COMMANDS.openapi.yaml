    # END P00 IMPLEMENTED MEMBERSHIP SCHEMAS
    Money:
      type: object
      additionalProperties: false
      properties:
        amount: &id004
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currency
    ProjectCreate:
      type: object
      additionalProperties: false
      properties:
        intakeMode:
          type: string
          enum:
          - draft
          - activate
          default: draft
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          minLength: 1
        originCode:
          type: string
          minLength: 1
        ownerId: *id001
        templateId: *id001
        legalEntityId: *id001
        clientPartyId: *id001
        customFields:
          type: object
          additionalProperties: true
      required: []
    PolicyPublish:
      type: object
      additionalProperties: false
      properties:
        expectedActiveSnapshotId:
          anyOf:
          - *id001
          - type: 'null'
        draftVersionId: *id001
        impactReportId: *id001
        authorityDecisionIds:
          type: array
          items: *id001
      required:
      - expectedActiveSnapshotId
      - draftVersionId
      - impactReportId
      - authorityDecisionIds
    ApprovalDecision:
      type: object
      additionalProperties: false
      properties:
        targetVersionId: *id001
        targetHash: &id003
          type: string
          pattern: ^[a-f0-9]{64}$
        outcome:
          type: string
          enum:
          - approved
          - rejected
          - changes_requested
          - conditional
          - abstained
        acknowledgedConditions:
          type: array
          items:
            type: string
        comment:
          type: string
          maxLength: 10000
      required:
      - targetVersionId
      - targetHash
      - outcome
      - acknowledgedConditions
    ExceptionScope:
      type: object
      additionalProperties: false
      properties:
        projectId: *id001
        targetRecordId: *id001
        targetVersionId: *id001
        ruleIds:
          type: array
          items:
            type: string
          minItems: 1
        allowedActions:
          type: array
          items:
            type: string
          minItems: 1
        locationIds:
          type: array
          items: *id001
        amountCap:
