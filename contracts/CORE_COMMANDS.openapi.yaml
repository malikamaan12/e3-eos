  /memberships/{id}/revoke:
    {
      "post": {
        "operationId": "revokeOrganisationMembership",
        "summary": "Revoke one organisation membership atomically",
        "description": "Requires current internal membership and a current database Super Admin flag or canonical super_admin role. Caller role headers do not grant authority. The transaction rechecks current session/membership, prevents self and last-admin lockout, and commits membership change, append-only audit event, outbox event and durable idempotency receipt together. An identical same-actor retry returns the original 201 body across server instances; authority is rechecked before replay. Other organisation memberships and their access are not revoked. The durable mutation increments membership rowVersion. Retrieve the current directory rowVersion before a subsequent role/restoration command; the legacy revocation response shape remains unchanged.",
        "x-eos-permission": "membership.revoke",
        "x-eos-status": "implemented",
        "security": [
          {
            "eosBearer": []
          },
          {
            "eosSession": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "x-organisation-id",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Optional organisation selector; must match a current membership of the session identity. Never grants membership."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200,
              "pattern": "\\S"
            },
            "description": "Durable key scoped to the organisation and bound to actor, operation, target membership and trimmed reason. Reuse exactly this key after an uncertain result."
          },
          {
            "name": "Origin",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uri"
            },
            "description": "Required for cookie-authenticated writes and must exactly match the configured web-origin allowlist. A browser-supplied untrusted Origin is rejected even with Bearer authentication. Non-browser Bearer clients may omit Origin."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MembershipRevocationRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Committed membership revocation, or the exact original durable receipt replay.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MembershipRevocationResult"
                }
              }
            }
          },
          "400": {
            "description": "Invalid membership ID, missing/nonempty/oversized command key, or invalid revocation reason.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Session or current organisation membership is missing, expired or revoked.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Insufficient current authority or untrusted command Origin.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CommandOriginRejection"
                }
              }
            }
          },
          "404": {
            "description": "Membership not found in the current organisation; unknown and cross-organisation IDs are indistinguishable.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "IDEMPOTENCY_CONFLICT, MEMBERSHIP_ALREADY_REVOKED, SELF_REVOCATION_PROHIBITED, LAST_ADMIN_REVOCATION_PROHIBITED or MEMBERSHIP_CHANGED. Replay an already committed command using its original key.",
