              "format": "uuid"
            },
            "description": "Optional organisation selector; must match a current membership of the session identity. Never grants membership."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200,
              "pattern": "\\S"
            },
            "description": "Durable organisation-scoped key bound to the current actor, operation and normalized request fields, including expectedVersion where present. Reuse the same key and body after an uncertain result; changed payload, operation or actor returns 409. Current authority is rechecked before replay."
          },
          {
            "name": "Origin",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uri"
            },
            "description": "Required for cookie-authenticated writes and must exactly match the configured web-origin allowlist. A browser-supplied untrusted Origin is rejected even with Bearer authentication. Non-browser Bearer clients may omit Origin."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ProjectAccessRevokeRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Committed result or the exact original durable receipt replay.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProjectAccessCommandResult"
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_ERROR or MISSING_IDEMPOTENCY_KEY: invalid UUID, bounded reason/key, access level or required positive expectedVersion.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "UNAUTHENTICATED: current scoped session or current active membership cannot be verified.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "PROJECT_ACCESS_ADMIN_REQUIRED or PROJECT_ACCESS_AUDIENCE_UNSUPPORTED. Only current internal Super Admin authority manages grants; client memberships support viewer only and supplier grants are unavailable. Cookie-origin protection may also reject the command.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CommandOriginRejection"
                }
              }
            }
          },
          "404": {
            "description": "PROJECT_NOT_FOUND, PROJECT_ACCESS_TARGET_NOT_FOUND or PROJECT_ACCESS_NOT_FOUND: the addressed project, active membership or grant is unknown or outside the current organisation.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "IDEMPOTENCY_CONFLICT, PROJECT_ACCESS_ALREADY_EXISTS, PROJECT_ACCESS_VERSION_CONFLICT or PROJECT_ACCESS_REVOKED. A revoked grant cannot be changed or restored; a new explicit grant is required.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "PROJECT_ACCESS_STORAGE_UNAVAILABLE: the grant, audit, outbox and receipt transaction could not be verified or committed; no success or owner-based fallback is returned.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    }
