components:
  securitySchemes:
    eosSession:
      type: apiKey
      in: cookie
      name: eos_session
      description: Opaque server-side EOS session cookie. Unsafe cookie-authenticated commands require an explicitly allowed Origin; a missing or untrusted Origin is rejected. Production cookies use Secure and HttpOnly.
    eosBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque server-side session token
      description: The same opaque database session credential accepted by EOS. It is not a JWT role claim; current membership is rechecked. Non-browser Bearer clients may omit Origin.
  schemas:
    # BEGIN SCHEDULE PLANNING SCHEMAS
    WorkingInterval:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "startMinute": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1439
          },
          "endMinute": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1440
          }
        },
        "required": [
          "startMinute",
          "endMinute"
        ]
      }
    WorkingCalendarDefinition:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "timezone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "week": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "day": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 6
                },
                "intervals": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/WorkingInterval"
                  },
                  "maxItems": 4
                }
              },
              "required": [
                "day",
                "intervals"
              ]
            },
            "maxItems": 7,
            "minItems": 7
          },
          "exceptions": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "date": {
                  "type": "string",
                  "format": "date"
                },
                "intervals": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/WorkingInterval"
                  },
                  "maxItems": 4
                },
                "note": {
                  "type": "string",
                  "maxLength": 500
                }
              },
              "required": [
                "date",
                "intervals",
                "note"
              ]
            },
            "maxItems": 100
          }
        },
        "required": [
          "timezone",
          "week",
          "exceptions"
        ]
      }
    PlanningMilestoneDefinition:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "targetAt": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time",
                "description": "Exact offset instant, 1970–2100."
              },
              {
                "type": "null"
              }
            ]
          },
          "timezone": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 100
              },
              {
                "type": "null"
              }
            ]
          },
          "notes": {
            "type": "string",
            "maxLength": 2000
          }
        },
        "required": [
          "targetAt",
          "timezone",
          "notes"
        ]
      }
    SchedulePlanCreate:
      {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "const": "calendar"
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 200
              },
              "payload": {
                "$ref": "#/components/schemas/WorkingCalendarDefinition"
              },
              "reason": {
                "type": "string",
                "minLength": 1,
                "maxLength": 2000
              }
            },
            "required": [
              "kind",
              "title",
              "payload",
              "reason"
            ]
          },
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "const": "milestone"
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 200
              },
              "payload": {
                "$ref": "#/components/schemas/PlanningMilestoneDefinition"
              },
              "reason": {
                "type": "string",
                "minLength": 1,
                "maxLength": 2000
              }
            },
            "required": [
              "kind",
              "title",
              "payload",
              "reason"
            ]
          }
        ]
      }
    SchedulePlanRevision:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "minimum": 1
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "payload": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/WorkingCalendarDefinition"
              },
              {
                "$ref": "#/components/schemas/PlanningMilestoneDefinition"
              }
            ]
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        },
        "required": [
          "expectedVersion",
          "title",
          "payload",
          "reason"
        ]
      }
    BaselineCandidateCapture:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "expectedFingerprint": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        },
        "required": [
          "title",
          "expectedFingerprint",
          "reason"
        ]
      }
    BaselineCandidateCounts:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "tasks": {
            "type": "integer",
            "minimum": 0,
            "maximum": 500
          },
          "scheduledTasks": {
            "type": "integer",
            "minimum": 0,
            "maximum": 500
          },
          "dependencies": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1000
          },
          "calendars": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "milestones": {
            "type": "integer",
            "minimum": 0,
            "maximum": 200
          }
        },
        "required": [
          "tasks",
          "scheduledTasks",
          "dependencies",
          "calendars",
          "milestones"
        ]
      }
    BaselineCandidateSource:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "contractVersion": {
            "const": "baseline-candidate.v1"
          },
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "tasks": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            },
            "maxItems": 500
          },
          "dependencies": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            },
            "maxItems": 1000
          },
          "planning": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            },
            "maxItems": 300
          }
        },
        "required": [
          "contractVersion",
          "projectId",
          "tasks",
          "dependencies",
          "planning"
        ]
      }
    BaselineCandidatePayload:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "sourceFingerprint": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "counts": {
            "$ref": "#/components/schemas/BaselineCandidateCounts"
          },
          "source": {
            "$ref": "#/components/schemas/BaselineCandidateSource"
          }
        },
        "required": [
          "sourceFingerprint",
          "counts"
        ]
      }
    SchedulePlanRecord:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "enum": [
              "calendar",
              "milestone",
              "baseline_candidate"
            ]
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "payload": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/WorkingCalendarDefinition"
              },
              {
                "$ref": "#/components/schemas/PlanningMilestoneDefinition"
              },
              {
                "$ref": "#/components/schemas/BaselineCandidatePayload"
              }
            ]
          },
          "snapshotIntegrityVerified": {
            "type": "boolean"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "description": "Exact offset instant, 1970–2100."
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "description": "Exact offset instant, 1970–2100."
          },
          "approvalStatus": {
            "const": "not_approved"
          }
        },
        "required": [
          "id",
          "projectId",
          "kind",
          "title",
          "version",
          "payload",
          "snapshotIntegrityVerified",
          "createdAt",
          "updatedAt",
          "approvalStatus"
        ]
      }
    SchedulePlanList:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SchedulePlanRecord"
            },
            "maxItems": 325
          },
          "meta": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "canEdit": {
                "type": "boolean"
              },
              "limit": {
                "const": 300
              },
              "candidateLimit": {
                "const": 25
              },
              "truncated": {
                "type": "boolean"
              },
              "dataAsOf": {
                "type": "string",
                "format": "date-time",
                "description": "Exact offset instant, 1970–2100."
              }
            },
            "required": [
              "canEdit",
              "limit",
              "candidateLimit",
              "truncated",
              "dataAsOf"
            ]
          }
        },
        "required": [
          "data",
          "meta"
        ]
      }
    SchedulePlanReceipt:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "data": {
            "allOf": [
              {
                "type": "object",
                "additionalProperties": true,
                "required": [
                  "id",
                  "auditEventId",
                  "eventId"
                ],
                "properties": {
                  "id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "auditEventId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "eventId": {
                    "type": "string",
                    "format": "uuid"
                  }
                }
              }
            ]
          },
          "meta": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "data",
          "meta"
        ]
      }
    SchedulePlanHistory:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "version": {
                  "type": "integer",
                  "minimum": 1
                },
                "snapshot": {
                  "type": "object",
                  "additionalProperties": true
                },
                "snapshotIntegrityVerified": {
                  "type": "boolean"
                },
                "reason": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 2000
                },
                "actorId": {
                  "type": "string",
                  "format": "uuid"
                },
                "createdAt": {
                  "type": "string",
                  "format": "date-time",
                  "description": "Exact offset instant, 1970–2100."
                }
              },
              "required": [
                "id",
                "version",
                "snapshot",
                "snapshotIntegrityVerified",
                "reason",
                "actorId",
                "createdAt"
              ]
            },
            "maxItems": 100
          },
          "meta": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "const": 100
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": [
              "limit",
              "truncated"
            ]
          }
        },
        "required": [
          "data",
          "meta"
        ]
      }
    BaselineCandidatePreview:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "data": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "sourceFingerprint": {
                "type": "string"
              },
              "counts": {
                "$ref": "#/components/schemas/BaselineCandidateCounts"
              },
              "source": {
                "$ref": "#/components/schemas/BaselineCandidateSource"
              }
            },
            "required": [
              "sourceFingerprint",
              "counts",
              "source"
            ]
          },
          "meta": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "dataAsOf": {
                "type": "string",
                "format": "date-time",
                "description": "Exact offset instant, 1970–2100."
              }
            },
            "required": [
              "dataAsOf"
            ]
          }
        },
        "required": [
          "data",
          "meta"
        ]
      }
    BaselineCandidateComparison:
      {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "data": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "candidate": {
                "$ref": "#/components/schemas/SchedulePlanRecord"
              },
              "currentFingerprint": {
                "type": "string"
              },
              "sourceChanged": {
                "type": "boolean"
              },
              "planningChanged": {
                "type": "boolean"
              },
              "dependenciesChanged": {
                "type": "boolean"
              },
              "changes": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "taskId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "title": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 200
                    },
                    "status": {
                      "enum": [
                        "added",
                        "removed",
                        "changed",
                        "unchanged"
                      ]
                    },
                    "beforeStart": {
                      "anyOf": [
                        {
                          "type": "string",
                          "format": "date-time",
                          "description": "Exact offset instant, 1970–2100."
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "beforeFinish": {
                      "anyOf": [
                        {
                          "type": "string",
                          "format": "date-time",
                          "description": "Exact offset instant, 1970–2100."
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currentStart": {
                      "anyOf": [
                        {
                          "type": "string",
                          "format": "date-time",
                          "description": "Exact offset instant, 1970–2100."
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currentFinish": {
                      "anyOf": [
                        {
                          "type": "string",
                          "format": "date-time",
                          "description": "Exact offset instant, 1970–2100."
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "finishShiftMinutes": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": [
                    "taskId",
                    "title",
                    "status",
                    "beforeStart",
                    "beforeFinish",
                    "currentStart",
                    "currentFinish",
                    "finishShiftMinutes"
                  ]
                },
                "maxItems": 1000
              }
            },
            "required": [
              "candidate",
              "currentFingerprint",
              "sourceChanged",
              "planningChanged",
              "dependenciesChanged",
              "changes"
            ]
          },
