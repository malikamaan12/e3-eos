            "type": "string",
            "format": "uuid"
          },
          "baseVersion": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2147483647
          },
          "note": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000,
            "pattern": "\\S",
            "description": "Low-sensitivity text observation only. Do not include personal or incident narratives.",
            "not": {
              "pattern": "\\u0000"
            }
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000,
            "pattern": "\\S",
            "not": {
              "pattern": "\\u0000"
            }
          }
        },
        "required": [
          "clientOperationId",
          "deviceId",
          "capturedAt",
          "note",
          "reason"
        ],
        "dependentRequired": {
          "baseVersion": [
