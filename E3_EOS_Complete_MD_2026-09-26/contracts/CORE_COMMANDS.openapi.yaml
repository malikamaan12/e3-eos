components:
  securitySchemes:
    eosSession:
      type: apiKey
      in: cookie
      name: __Host-eos-session
      description: Logical session-cookie contract. Map the tested Better Auth cookie
        configuration to this name or update this contract before implementation;
        server-side sessions and CSRF/origin enforcement required.
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount: &id004
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currency
    ProjectCreate:
      type: object
      additionalProperties: false
      properties:
        intakeMode:
          type: string
          enum:
          - draft
          - activate
          default: draft
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          minLength: 1
        originCode:
          type: string
          minLength: 1
        ownerId: *id001
        templateId: *id001
        legalEntityId: *id001
        clientPartyId: *id001
        customFields:
          type: object
          additionalProperties: true
      required: []
    PolicyPublish:
      type: object
      additionalProperties: false
      properties:
        expectedActiveSnapshotId:
          anyOf:
          - *id001
          - type: 'null'
        draftVersionId: *id001
        impactReportId: *id001
        authorityDecisionIds:
          type: array
          items: *id001
      required:
      - expectedActiveSnapshotId
      - draftVersionId
      - impactReportId
      - authorityDecisionIds
    ApprovalDecision:
      type: object
      additionalProperties: false
      properties:
        targetVersionId: *id001
        targetHash: &id003
          type: string
          pattern: ^[a-f0-9]{64}$
        outcome:
          type: string
          enum:
          - approved
          - rejected
          - changes_requested
          - conditional
          - abstained
        acknowledgedConditions:
          type: array
          items:
            type: string
        comment:
          type: string
          maxLength: 10000
      required:
      - targetVersionId
      - targetHash
      - outcome
      - acknowledgedConditions
    ExceptionScope:
      type: object
      additionalProperties: false
      properties:
        projectId: *id001
        targetRecordId: *id001
        targetVersionId: *id001
        ruleIds:
          type: array
          items:
            type: string
          minItems: 1
        allowedActions:
          type: array
          items:
            type: string
          minItems: 1
        locationIds:
          type: array
          items: *id001
        amountCap:
          $ref: '#/components/schemas/Money'
      required:
      - projectId
      - targetRecordId
      - targetVersionId
      - ruleIds
      - allowedActions
    ExceptionReviewPolicy:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - required
          - not_required_with_basis
        ownerId: *id001
        reviewDueAt: &id002
          type: string
          format: date-time
        templateId: *id001
        basis:
          type: string
      required:
      - mode
      allOf:
      - if:
          properties:
            mode:
              const: required
        then:
          required:
          - ownerId
          - reviewDueAt
          - templateId
      - if:
          properties:
            mode:
              const: not_required_with_basis
        then:
          required:
          - basis
    ExceptionRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/ExceptionScope'
        reason:
          type: string
          minLength: 1
        authorityBasisId: *id001
        validFrom: *id002
        validUntil: *id002
        maxUses:
          type: integer
          minimum: 1
        reviewPolicy:
          $ref: '#/components/schemas/ExceptionReviewPolicy'
        evidenceVersionIds:
          type: array
          items: *id001
      required:
      - scope
      - reason
      - authorityBasisId
      - validFrom
      - validUntil
      - maxUses
      - reviewPolicy
      - evidenceVersionIds
    ExceptionAuthorise:
      type: object
      additionalProperties: false
      properties:
        targetVersionId: *id001
        targetHash: *id003
        authorityDecisionIds:
          type: array
          items: *id001
        approvedScope:
          $ref: '#/components/schemas/ExceptionScope'
        validFrom: *id002
        validUntil: *id002
        maxUses:
          type: integer
          minimum: 1
        reviewPolicy:
          $ref: '#/components/schemas/ExceptionReviewPolicy'
      required:
      - targetVersionId
      - targetHash
      - authorityDecisionIds
      - approvedScope
      - validFrom
      - validUntil
      - maxUses
      - reviewPolicy
    ExceptionReview:
      type: object
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum:
          - in_review
          - remediation_required
          - closed
        disposition:
          type: string
          minLength: 1
        evidenceVersionIds:
          type: array
          items: *id001
        remainingActionIds:
          type: array
          items: *id001
      required:
      - outcome
      - disposition
      - evidenceVersionIds
      - remainingActionIds
    PurchaseOrderRelease:
      type: object
      additionalProperties: false
      properties:
        targetVersionId: *id001
        targetHash: *id003
        authorityBasisId: *id001
        approvalDecisionIds:
          type: array
          items: *id001
        exceptionId: *id001
      required:
      - targetVersionId
      - targetHash
      - authorityBasisId
      - approvalDecisionIds
    ReservationConfirm:
      type: object
      additionalProperties: false
      properties:
        expectedResourceVersion:
          type: integer
          minimum: 1
        planningStart: *id002
        planningEnd: *id002
        quantity: *id004
        authorityBasisId: *id001
      required:
      - expectedResourceVersion
      - planningStart
      - planningEnd
      - quantity
    DesignRelease:
      type: object
      additionalProperties: false
      properties:
        versionId: *id001
        targetHash: *id003
        purpose:
          type: string
          minLength: 1
        affectedPackageIds:
          type: array
          items: *id001
          minItems: 1
        approvalDecisionIds:
          type: array
          items: *id001
      required:
      - versionId
      - targetHash
      - purpose
      - affectedPackageIds
      - approvalDecisionIds
    OpeningRelease:
      type: object
      additionalProperties: false
      properties:
        scopeIds:
          type: array
          items: *id001
          minItems: 1
        evaluatedReadinessVersion: *id001
        evidenceVersionIds:
          type: array
          items: *id001
        approvalDecisionIds:
          type: array
          items: *id001
        validUntil: *id002
      required:
      - scopeIds
      - evaluatedReadinessVersion
      - evidenceVersionIds
      - approvalDecisionIds
      - validUntil
    ClientDecision:
      type: object
      additionalProperties: false
      properties:
        publicationId: *id001
        publicationVersion:
          type: integer
          minimum: 1
        targetHash: *id003
        purpose:
          type: string
        decision:
          type: string
          enum:
          - accepted
          - rejected
          - changes_requested
          - conditional
        comment:
          type: string
      required:
      - publicationId
      - publicationVersion
      - targetHash
      - purpose
      - decision
    OfflineOperation:
      type: object
      additionalProperties: false
      properties:
        clientOperationId: *id001
        projectId: *id001
        targetRecordId: *id001
        capturedAt: *id002
        baseVersion:
          type: integer
          minimum: 0
        manifestVersion: *id001
        type:
          type: string
          enum:
          - note.capture
          - photo.reference
          - checklist.observe
          - attendance.capture
          - asset.scan
          - delivery.observe
          - incident.capture
          - protective_action.capture
        payload:
          type: object
          additionalProperties: true
      required:
      - clientOperationId
      - projectId
      - capturedAt
      - baseVersion
      - manifestVersion
      - type
      - payload
    OfflineBatch:
      type: object
      additionalProperties: false
      properties:
        batchId: *id001
        deviceId: *id001
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OfflineOperation'
          minItems: 1
          maxItems: 100
      required:
      - batchId
      - deviceId
      - operations
    ReportPublish:
      type: object
      additionalProperties: false
      properties:
        reportVersionId: *id001
        sourceSnapshotId: *id001
        targetHash: *id003
        audience:
          type: string
          enum:
          - internal
          - client
          - restricted
        approvalDecisionIds:
          type: array
          items: *id001
      required:
      - reportVersionId
      - sourceSnapshotId
      - targetHash
      - audience
      - approvalDecisionIds
    CloseDimension:
      type: object
      additionalProperties: false
      properties:
        dimension:
          type: string
          enum:
          - operational
          - acceptance
          - reporting
          - financial_review
          - settlement
        evidenceManifestId: *id001
        decisionIds:
          type: array
          items: *id001
        disclosedOpenItems:
          type: array
          items: *id001
      required:
      - dimension
      - evidenceManifestId
      - decisionIds
      - disclosedOpenItems
    ScenarioApply:
      type: object
      additionalProperties: false
      properties:
        scenarioVersionId: *id001
        impactReportId: *id001
        expectedProjectVersions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              projectId: *id001
              recordVersion:
                type: integer
                minimum: 1
            required:
            - projectId
            - recordVersion
          minItems: 1
        approvalDecisionIds:
          type: array
          items: *id001
      required:
      - scenarioVersionId
      - impactReportId
      - expectedProjectVersions
      - approvalDecisionIds
    FinancialImport:
      type: object
      additionalProperties: false
      properties:
        connectorAccountId: *id001
        manualSourceId: *id001
        sourcePeriod:
          type: string
          minLength: 1
        currencyBasis:
          type: string
          minLength: 1
        fileVersionId: *id001
        mappingVersion: *id001
        reviewId: *id001
      required:
      - sourcePeriod
      - currencyBasis
      - fileVersionId
      - mappingVersion
      - reviewId
      oneOf:
      - required:
        - connectorAccountId
        not:
          required:
          - manualSourceId
      - required:
        - manualSourceId
        not:
          required:
          - connectorAccountId
    CommandResult:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            id: *id001
            status:
              type: string
            recordVersion:
              type: integer
              minimum: 1
            jobId: *id001
            externalDeliveryStatus:
              type: string
              enum:
              - not_applicable
              - queued
              - delivered
              - acknowledged
              - ambiguous
              - failed
          required:
          - id
          - status
          - recordVersion
        meta:
          type: object
          additionalProperties: false
          properties:
            requestId:
              type: string
            policySnapshotId: *id001
            dataAsOf: *id002
          required:
          - requestId
      required:
      - data
      - meta
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
