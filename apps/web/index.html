<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E3-EOS | Enterprise Event Operating System</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d97706'/><text x='50' y='68' font-size='50' font-weight='900' fill='white' text-anchor='middle'>E3</text></svg>" />
    <style>
      :root {
        --canvas: #090D16;
        --surface-1: #0F1624;
        --surface-2: #151E2E;
        --surface-3: #1B2638;
        --surface-inset: #0B111D;
        --border-subtle: #1D2939;
        --border-default: #2A374B;
        --border-strong: #475467;
        --text-primary: #F8FAFC;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --text-disabled: #64748B;
        --accent: #D97706;
        --accent-hover: #F59E0B;
        --accent-pressed: #B45309;
        --accent-soft: rgba(217,119,6,.14);
        --focus-ring: #F59E0B;
        color-scheme: dark;
      }
      [data-theme="light"] {
        --canvas: #F4F6F8;
        --surface-1: #FFFFFF;
        --surface-2: #FFFFFF;
        --surface-3: #F8FAFC;
        --surface-inset: #EEF2F6;
        --border-subtle: #E4E7EC;
        --border-default: #D0D5DD;
        --border-strong: #98A2B3;
        --text-primary: #101828;
        --text-secondary: #344054;
        --text-muted: #667085;
        --text-disabled: #98A2B3;
        --accent: #B45309;
        --accent-hover: #92400E;
        --accent-pressed: #78350F;
        --accent-soft: #FFF7ED;
        --focus-ring: #D97706;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        height: 100%;
        background-color: var(--canvas);
        color: var(--text-primary);
        font-family: Inter, "Noto Sans Arabic", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scrollbar-width: thin;
        scrollbar-color: var(--border-default) var(--surface-inset);
      }
      #root {
        min-height: 100%;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface-inset);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-default);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-strong);
      }
      h1, h2, h3, h4, h5, h6 {
        color: var(--text-primary);
        font-family: inherit;
        letter-spacing: -0.01em;
      }
      input, select, textarea, button {
        font-family: inherit;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        color: var(--accent-hover);
      }
      [dir="rtl"] {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[E3-EOS SW] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
