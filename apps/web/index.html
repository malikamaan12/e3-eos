<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>E3-EOS | Enterprise Event Operating System</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/brand/e3-mark.svg" />
    <style>
      :root {
        --canvas: #090D16;
        --surface-1: #0F1624;
        --surface-2: #151E2E;
        --surface-3: #1B2638;
        --surface-inset: #0B111D;
        --border-subtle: #1D2939;
        --border-default: #2A374B;
        --border-strong: #475467;
        --text-primary: #F8FAFC;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --text-disabled: #64748B;
        --accent: #D97706;
        --accent-hover: #F59E0B;
        --accent-pressed: #B45309;
        --accent-soft: rgba(217,119,6,.14);
        --focus-ring: #F59E0B;
        color-scheme: dark;
      }
      [data-theme="light"] {
        --canvas: #F4F6F8;
        --surface-1: #FFFFFF;
        --surface-2: #FFFFFF;
        --surface-3: #F8FAFC;
        --surface-inset: #EEF2F6;
        --border-subtle: #E4E7EC;
        --border-default: #D0D5DD;
        --border-strong: #98A2B3;
        --text-primary: #101828;
        --text-secondary: #344054;
        --text-muted: #667085;
        --text-disabled: #98A2B3;
        --accent: #B45309;
        --accent-hover: #92400E;
        --accent-pressed: #78350F;
        --accent-soft: #FFF7ED;
        --focus-ring: #D97706;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        height: 100%;
        background-color: var(--canvas);
        color: var(--text-primary);
        font-family: Inter, "Noto Sans Arabic", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scrollbar-width: thin;
        scrollbar-color: var(--border-default) var(--surface-inset);
      }
      #root {
        min-height: 100%;
      }
      .eos-app-header { gap: 8px; flex-wrap: wrap; padding-block: 8px !important; }
      .eos-header-brand, .eos-header-actions { flex-shrink: 0; }
      .eos-header-actions { flex-wrap: wrap; }
      .eos-header-actions button { white-space: nowrap; }
      #global-project-switcher-container, #global-project-selector { min-width: 0; }
      .eos-header-search { min-width: 140px; }
      @media (max-width: 1600px) {
        .eos-header-subtitle { display: none; }
        .eos-header-search { margin: 0 !important; }
      }
      @media (max-width: 767px) {
        .eos-header-brand { flex: 1 1 auto; }
        #global-project-switcher-container { flex: 1 1 130px !important; margin: 0 !important; }
        .eos-header-actions { width: 100%; justify-content: space-between; gap: 4px !important; }
        .eos-header-actions button { min-height: 40px; padding-inline: 8px !important; }
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface-inset);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-default);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-strong);
      }
      h1, h2, h3, h4, h5, h6 {
        color: var(--text-primary);
        font-family: inherit;
        letter-spacing: -0.01em;
      }
      input, select, textarea, button {
        font-family: inherit;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        color: var(--accent-hover);
      }
      [dir="rtl"] {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
          }).catch(function(err) {
            console.warn('[E3-EOS SW] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
