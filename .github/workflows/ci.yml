name: E3-EOS Continuous Integration & Production Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Automated Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript Compilation
        run: pnpm -r run typecheck

      - name: Execute Vitest Automated Suites (172 tests across 21 files)
        run: pnpm test

      - name: Verify Production Deployment Gate (AT-089)
        run: |
          echo "Verifying absence of unreviewed mock endpoints or placeholder stubs..."
          # Reject any placeholder TODO handlers or mock services in production packages
          if grep -rn "stub_handler" packages/ apps/ ; then
            echo "ERROR: Found disallowed stub_handler in production artifacts"
            exit 1
          fi
          echo "Production deployment gate PASSED: Zero mock or stub artifacts detected."

  docker-build-check:
    name: Multi-Stage Docker Image Build Check
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: e3-eos-api:test

      - name: Build Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: false
          tags: e3-eos-worker:test

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: e3-eos-web:test
