name: E3-EOS Continuous Integration & Production Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Automated Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: e3_eos_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:devpassword123@localhost:5432/e3_eos_dev
      JWT_SECRET: super-secret-jwt-key-for-e3-eos-testing-minimum-32-chars-long!
      NODE_ENV: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm build

      - name: Strict TypeScript Compilation
        run: pnpm -r run typecheck

      - name: Run Database Migrations & Seed
        run: |
          pnpm migrate
          pnpm seed

      - name: Execute Vitest Automated Suites (478 tests across 48 test suites)
        run: pnpm test

      - name: Verify 100% Acceptance Test Traceability Matrix (92/92 Scenarios)
        run: pnpm verify:matrix

      - name: Verify Production Deployment Gate (AT-089)
        run: |
          echo "Verifying absence of unreviewed mock endpoints or placeholder stubs..."
          # Reject any placeholder TODO handlers or mock services in production packages
          if grep -rn "stub_handler" packages/ apps/ ; then
            echo "ERROR: Found disallowed stub_handler in production artifacts"
            exit 1
          fi
          echo "Production deployment gate PASSED: Zero mock or stub artifacts detected."

  docker-build-check:
    name: Multi-Stage Docker Image Build Check
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: e3-eos-api:test

      - name: Build Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: false
          tags: e3-eos-worker:test

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: e3-eos-web:test
